<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <title>Cadastro de Roupas Femininas</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css"/>
    <script type="text/javascript" src="vue.min.js"></script>
    <script type="text/javascript" src="axios.min.js"></script>
    <link rel="stylesheet" href="Projeto.css"/>
</head>
<body>
    <div class="container" id="app">
        <header>
            <img src="background.jpg" alt="background" class="img-fluid"/>
        </header>
        <main>
            <h1>Cadastro de Roupas Femininas</h1>
            <div class="row">
                <div class="col-md-6">        
                    <input type="text" class="form-control mb-3" placeholder="Nome da Peça" v-model="nome">
                    <input type="text" class="form-control mb-3" placeholder="Tamanho (P, M, G, etc.)" v-model="tamanho">
                    <input type="text" class="form-control mb-3" placeholder="Cor" v-model="cor">
                    <input type="text" class="form-control mb-3" placeholder="Marca" v-model="marca">
                    <input type="number" class="form-control mb-3" placeholder="Preço (R$)" v-model="preco">
                    <div v-if="verificarCampos()">
                        <button id="btn-salvar" @click="salvar()" class="btn salvar-btn">Salvar</button>
                    </div>
                    <div v-else>
                        <button id="btn-salvar" class="btn btn-primary mb-3" disabled>Salvar</button>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="table-container">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Tamanho</th>
                                <th>Cor</th>
                                <th>Marca</th>
                                <th>Preço</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(roupa, index) in listaRoupas">
                                <td>{{ roupa.nome }}</td>
                                <td>{{ roupa.tamanho }}</td>
                                <td>{{ roupa.cor }}</td>
                                <td>{{ roupa.marca }}</td>
                                <td>{{ roupa.preco }}</td>
                                <td>
                                    <button id="btn-alterar" class="btn btn-warning" @click="alterar(index)">Alterar</button>
                                </td>
                                <td>
                                    <button id="btn-excluir" class="btn btn-danger" @click="excluir(index)">Excluir</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div> 
        </main>
    </div>
    
    <script type="text/javascript">
        class Roupa {
            constructor(nome, tamanho, cor, marca, preco) {
                this.nome = nome;
                this.tamanho = tamanho;
                this.cor = cor;
                this.marca = marca;
                this.preco = preco;
            }
        }

        var app = new Vue({
         el: '#app',
         data: {
             nome: '',
             tamanho: '',
             cor: '',
             marca: '',
             preco: '',
             listaRoupas:[],
             posicao: -1
         },
         methods: {
             verificarCampos: function() {
                 return (this.nome != '' && this.tamanho != '' && this.cor != '' && this.marca != '' && this.preco != '');
             },
             salvar: function() {
                 let novaRoupa = new Roupa(this.nome, this.tamanho, this.cor, this.marca, this.preco);
                 if (this.posicao == -1) {
                     this.listaRoupas.push(novaRoupa);
                 }
                 else {
                     Vue.set(this.listaRoupas, this.posicao, novaRoupa);
                     this.posicao = -1;
                 }
                 this.nome = '';
                 this.tamanho = '';
                 this.cor = '';
                 this.marca = '';
                 this.preco = '';
                 this.posicao = -1;
             },
            
             alterar: function (index){
                 this.nome = this.listaRoupas[index].nome;
                 this.tamanho = this.listaRoupas[index].tamanho;
                 this.cor = this.listaRoupas[index].cor;
                 this.marca = this.listaRoupas[index].marca;
                 this.preco = this.listaRoupas[index].preco;
                 this.posicao = index;
             },
             excluir: function (index){
                 if (confirm('Deseja excluir?')) {
                     this.listaRoupas.splice(index, 1);
                 }
             }
         }
     });
    </script>
</body>
</html>
